<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webflow</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>

        <!-- Nav bar section -->
        <nav>
            <div class="nav-brand">
                <img id="nav-logo" src="images/homePage/logo.png" alt="Logo">
            </div>
            <div id="nav-links-header">
                <a href="pages/index.html">Home</a>
                <a href="pages/pricing.html">Pricing</a>
                <a href="pages/careers.html">Careers</a>
                <a href="pages/about.html">About</a>
            </div>
        </nav>
        <section id="hero-section">
            <div id="hero-content">
                <h1>placeholder Header</h1>
                <p>placeholder text</p>
                <button id="hero-button">placeholder button</button>
            </div>
            <div id="hero-image-container">
                <img id="hero-image" src="images/homePage/heroImg.jpg" alt="Image">
            </div>
        </section>
    </header>


    <!-- Main section -->

    <main>
        <section id="information-section">
            <div class="info-header-container">
                <h2>Our Solutions</h2>
            </div>
            <div id="templates-wrapper">
                <!-- article 1 -->
                <article class="template-article">
                    <figure>
                        <img class="info-image" src="images/homePage/webflow-template-1.webp" alt="-website-template-1">
                        <figcaption class="image-caption">
                            Real-time collaboration on the design canvas.
                        </figcaption>
                    </figure>
                </article>

                <!-- article 2 -->
                <article class="template-article">
                    <figure>
                        <img class="info-image" src="images/homePage/webflow-template-2.webp" alt="website-template-2">
                        <figcaption class="image-caption">
                            AI tool generating responsive website layouts.
                        </figcaption>
                    </figure>
                </article>

                <!-- article 3 -->
                <article class="template-article">
                    <figure>
                        <img class="info-image" src="images/homePage/webflow-template-3.webp" alt="website-template-3">
                        <figcaption class="image-caption">
                            Inspecting CSS grid properties in developer mode.
                        </figcaption>
                    </figure>
                </article>

                <!-- article 4 -->
                <article class="template-article">
                    <figure>
                        <img class="info-image" src="images/homePage/webflow-template-4.webp" alt="website-template-4">
                        <figcaption class="image-caption">
                            Visual timeline tracking layout design iterations.
                        </figcaption>
                    </figure>
                </article>
            </div>
        </section>

        <section id="call-to-action-section">
            <div id="call-to-action-outer-container">
                <div>
                    <h3>Get your new website now!</h3>
                    <p>Elevate your project or company now with a fresh new website, made by our experts at Webflow.</p>
                </div>
                <div>
                    <a href="pages/pricing.html" id="call-to-action-button">Get Started</a>
                </div>
            </div>
        </section>
    </main>



    <!-- Footer section -->
    <footer>
        <p id="footer-text">placeholder text</p>

        <nav id="nav-links-footer">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="careers.html">Careers</a></li>
                <li><a href="pricing.html">Pricing</a></li>
            </ul>
        </nav>
    </footer>
</body>

</html>
